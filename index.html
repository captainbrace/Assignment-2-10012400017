<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workshop Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="title">
    <h1>Developer Workshop Registration</h1>
    </div>

    <div class="form-container">

    <form id="registration-form">

        <div class="credentials">
        <label for="full name">Enter Your Full Name:</label>
        <input type="text" id="full name"><br>

        <label for="email">Enter Your Email:</label>
        <input type="email" id="email"><br>
        </div>


        <label for="levels">Enter Your Experience Level</label>
        <select name="levels" id="levels">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select><br>

        <div class="radio-group">
        <p>Choose your workshop track:</p>
        <label for="frontend web">
        <input type="radio" id="frontend web" name="Workshop Track" value="Frontend Web">
        Frontend Web</label>
        <label for="backend api">
        <input type="radio" id="backend api" name="Workshop Track" value="Backend API">
        Backend API</label>
        <label for="ui/ux design">
        <input type="radio" id="ui/ux design" name="Workshop Track" value="UI/UX Design">
        UI/UX Design</label>
  </div>
  <br>

        <label for="agree">Do you agree to receive event updates
        <input id="agree" type="checkbox"><br>
        </label>

        <button id ="toregister" type="submit"> Register Now </button> <br>
        <a href="#" class="'btn"> View Profile</a>
    </div>
    </form>
    </div>
</body>
</html>
